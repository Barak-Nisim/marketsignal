<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MarketSignal{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.remove("no-js");</script>
</head>
<body>
  <header class="site-nav">
    <a href="/" class="brand">
      <svg class="logo-mark" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true">
        <rect x="6" y="28" width="8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="20" y="18" width="8" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="34" y="8" width="8" height="34" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M6 24 L20 14 L34 4 L34 10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark">MarketSignal</span>
    </a>
    <nav>
      <a href="/how-it-works">How it works</a>
      <a href="/app" class="nav-cta">Try the demo</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>MarketSignal is a portfolio project by <strong>Barak Nisim</strong>, also used for his own investment research. Not financial advice.</p>
    <p>
      <a href="https://github.com/Barak-Nisim/marketsignal">Source on GitHub</a>
      &middot; MIT License
    </p>
  </footer>

  <script>
    (function () {
      var targets = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window) || targets.length === 0) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      targets.forEach(function (el) { observer.observe(el); });
    })();
  </script>
</body>
</html>
